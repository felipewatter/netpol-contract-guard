name: Publish version after green CI
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: netpol-contract-guard-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout the exact successful commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify checked-out SHA is the current main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TESTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.head_sha')" = "$TESTED_SHA"
      - name: Re-run test suite on publisher
        run: |
          python -m pip install --no-deps -e .
          python -m unittest discover -s tests -q
      - name: Build auditable source ZIP, wheel, manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py dist
          python -m pip wheel --no-deps . -w dist
          python -c 'from pathlib import Path; import hashlib; p=Path("dist"); f=next(p.glob("*.whl")); c=next(p.glob("*SHA256SUMS.txt")); c.open("a").write(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name+"\n")'
      - name: Publish exactly one immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists: do not overwrite immutable assets."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --silent >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; refusing to rebind it."
            exit 1
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TESTED_SHA"
          gh release create "$VERSION" dist/* \
            --target "$TESTED_SHA" \
            --title "NetPol ContractGuard $VERSION" \
            --notes-file docs/RELEASE_NOTES.md
